name: 自动同步Surge规则

on:
  schedule:
    # 每天北京时间早上8点运行
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行规则同步脚本
        env:
          PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import urllib.request
          import os
          
          # 上游规则映射: 本地文件名 -> 活跃维护的上游URL
          sources = {
              # 基础规则 - Loyalsoldier源(长期活跃维护)
              "Rules/reject.list": "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/reject.txt",
              "Rules/proxy.list": "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/proxy.txt",
              "Rules/direct.list": "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt",
              
              # 流媒体/视频平台
              "Rules/Netflix.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Media/Netflix.list",
              "Rules/Disney.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Media/Disney%2B.list",
              "Rules/YouTube.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Video/YouTube.list",
              "Rules/tiktok.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Video/TikTok.list",
              "Rules/douying.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Video/DouYin.list",
              "Rules/bilibili.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Video/Bilibili.list",
              "Rules/iqiyi.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Media/iQiyi.list",
              "Rules/tencentvideo.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Media/TencentVideo.list",
              "Rules/youku.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Media/Youku.list",
              "Rules/Emby.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Media/Emby.list",
              "Rules/Globalmeda.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Media/GlobalMedia.list",
              "Rules/chinesemedia.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Media/ChinaMedia.list",
              
              # 音乐平台
              "Rules/spotify.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Audio/Spotify.list",
              "Rules/neteasemusic.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Audio/NetEaseMusic.list",
              
              # 社交/通讯
              "Rules/Instagram.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Social/Instagram.list",
              "Rules/Telegram.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Social/Telegram.list",
              "Rules/twitter.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Social/Twitter.list",
              "Rules/reddit.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Social/Reddit.list",
              "Rules/discord.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Social/Discord.list",
              "Rules/whatsapp.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Social/WhatsApp.list",
              "Rules/weibo.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Social/Weibo.list",
              "Rules/zhihu.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Social/Zhihu.list",
              
              # 大厂服务/工具
              "Rules/Google.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Service/Google.list",
              "Rules/Microsoft.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Service/Microsoft.list",
              "Rules/apple.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Service/Apple.list",
              "Rules/amazon.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Service/Amazon.list",
              "Rules/paypal.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Service/PayPal.list",
              "Rules/onedrive.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Service/OneDrive.list",
              "Rules/dropbox.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Service/Dropbox.list",
              "Rules/baidu.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Service/Baidu.list",
              "Rules/taobao.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Service/Taobao.list",
              "Rules/jd.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Service/JD.list",
              "Rules/alipay.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Service/Alipay.list",
              
              # 游戏/工具
              "Rules/Game.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Game/Game.list",
              "Rules/steam.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Game/Steam.list",
              "Rules/Speedtest.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Tool/Speedtest.list",
              
              # AI服务
              "Rules/AI.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/AI/OpenAI.list",
              "Rules/anthropic.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/AI/Claude.list",
          }
          
          headers = {"User-Agent": "Mozilla/5.0"}
          changed = []
          
          for local_path, url in sources.items():
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      new_content = resp.read().decode('utf-8')
                  
                  os.makedirs(os.path.dirname(local_path), exist_ok=True)
                  old_content = ""
                  if os.path.exists(local_path):
                      with open(local_path, 'r', encoding='utf-8') as f:
                          old_content = f.read()
                  
                  if new_content != old_content:
                      with open(local_path, 'w', encoding='utf-8') as f:
                          f.write(new_content)
                      changed.append(local_path)
                      print(f"更新: {local_path}")
                  else:
                      print(f"无变化: {local_path}")
              except Exception as e:
                  print(f"拉取失败 {url}: {e}")
          
          print(f"变更文件数: {len(changed)}")
          EOF

      - name: 提交更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: 自动同步上游规则 $(date +%Y-%m-%d)"
            git push
          else
            echo "没有需要提交的变更"
          fi

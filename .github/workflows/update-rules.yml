name: 自动同步Surge规则

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载规则文件
        run: |
          set -e
          mkdir -p Rules
          BASE="https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider"
          
          # 基础规则
          wget -q -O Rules/reject.list "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/reject.txt"
          wget -q -O Rules/proxy.list "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/proxy.txt"
          wget -q -O Rules/direct.list "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt"
          
          # 根目录规则
          wget -q -O Rules/apple.list "$BASE/Apple.list"
          wget -q -O Rules/Microsoft.list "$BASE/Microsoft.list"
          wget -q -O Rules/PayPal.list "$BASE/PayPal.list"
          wget -q -O Rules/Speedtest.list "$BASE/Speedtest.list"
          wget -q -O Rules/steam.list "$BASE/Steam.list"
          wget -q -O Rules/Telegram.list "$BASE/Telegram.list"
          wget -q -O Rules/tiktok.list "$BASE/TikTok.list"
          wget -q -O Rules/discord.list "$BASE/Discord.list"
          wget -q -O Rules/douying.list "$BASE/Douyin.list"
          wget -q -O Rules/AI.list "$BASE/AI%20Suite.list"
          
          # Media目录规则
          wget -q -O Rules/Netflix.list "$BASE/Media/Netflix.list"
          wget -q -O Rules/Disney.list "$BASE/Media/Disney%20Plus.list"
          wget -q -O Rules/YouTube.list "$BASE/Media/YouTube.list"
          wget -q -O Rules/bilibili.list "$BASE/Media/Bilibili.list"
          wget -q -O Rules/spotify.list "$BASE/Media/Spotify.list"
          wget -q -O Rules/iqiyi.list "$BASE/Media/IQIYI.list"
          wget -q -O Rules/tencentvideo.list "$BASE/Media/Tencent%20Video.list"
          wget -q -O Rules/youku.list "$BASE/Media/Youku.list"
          wget -q -O Rules/neteasemusic.list "$BASE/Media/Netease%20Music.list"
          wget -q -O Rules/amazon.list "$BASE/Media/Amazon.list"
          wget -q -O Rules/pornhub.list "$BASE/Media/Pornhub.list"
          
          echo "所有规则下载完成"
          ls -la Rules/

      - name: 提交更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "没有变更"
          else
            git commit -m "chore: 自动同步规则 $(date +%Y-%m-%d)"
            git push
          fi

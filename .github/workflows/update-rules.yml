name: 自动同步Surge规则

on:
  schedule:
    # 每天北京时间早上8点运行
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行规则同步脚本
        env:
          PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'EOF'
          import urllib.request
          import os
          
          # 上游规则映射: 本地文件名 -> 上游URL
          sources = {
              # 广告拦截/基础代理直连规则 - Loyalsoldier源
              "Rules/reject.list": "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/reject.txt",
              "Rules/proxy.list": "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/proxy.txt",
              "Rules/direct.list": "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt",
              
              # 流媒体规则 - dler-io源
              "Rules/Netflix.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Media/Netflix.list",
              "Rules/Disney.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Media/Disney%2B.list",
              "Rules/YouTube.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Video/YouTube.list",
              "Rules/spotify.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Audio/Spotify.list",
              "Rules/tiktok.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Video/TikTok.list",
              "Rules/Instagram.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Social/Instagram.list",
              "Rules/Telegram.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Social/Telegram.list",
              "Rules/Emby.list": "https://raw.githubusercontent.com/dler-io/Rules/main/Surge/Surge%203/Provider/Media/Emby.list",
              
              # 大厂服务规则 - blackmatrix7源
              "Rules/Google.list": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Google/Google.list",
              "Rules/Microsoft.list": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Microsoft/Microsoft.list",
              "Rules/apple.list": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Apple/Apple.list",
              "Rules/Game.list": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Game/Game.list",
              "Rules/Globalmeda.list": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/GlobalMedia/GlobalMedia.list",
              "Rules/chinesemedia.list": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/ChinaMedia/ChinaMedia.list",
              "Rules/Speedtest.list": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Speedtest/Speedtest.list",
              "Rules/AI.list": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/OpenAI/OpenAI.list",
          }
          
          headers = {"User-Agent": "Mozilla/5.0"}
          changed = []
          
          for local_path, url in sources.items():
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      new_content = resp.read().decode('utf-8')
                  
                  os.makedirs(os.path.dirname(local_path), exist_ok=True)
                  old_content = ""
                  if os.path.exists(local_path):
                      with open(local_path, 'r', encoding='utf-8') as f:
                          old_content = f.read()
                  
                  if new_content != old_content:
                      with open(local_path, 'w', encoding='utf-8') as f:
                          f.write(new_content)
                      changed.append(local_path)
                      print(f"更新: {local_path}")
                  else:
                      print(f"无变化: {local_path}")
              except Exception as e:
                  print(f"拉取失败 {url}: {e}")
          
          if changed:
              print(f"::set-output name=changed::true")
          else:
              print(f"::set-output name=changed::false")
          EOF

      - name: 提交更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: 自动同步上游规则 $(date +%Y-%m-%d)"
            git push
          else
            echo "没有需要提交的变更"
          fi
